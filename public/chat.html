<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat - Luna Italiano</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/theme.css">
<style>
  .chat-wrap { display:flex; flex-direction:column; height: calc(100dvh - 62px); max-width:640px; margin:0 auto; }
  @media (max-width: 639px) {
    .chat-wrap { height: calc(100dvh - 62px - 60px); }
  }
  .chat-log { flex:1; overflow-y:auto; padding: 16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size:14px; line-height:1.4; position:relative; }
  .msg.io { align-self:flex-end; background: linear-gradient(135deg, var(--gold), #f0a93a); color:#2a1c00; border-bottom-right-radius:4px; }
  .msg.luna { align-self:flex-start; background: rgba(255,255,255,0.09); border:1px solid var(--card-border); border-bottom-left-radius:4px; }
  .msg .meta { font-size:10px; opacity:.6; margin-top:4px; display:flex; gap:8px; align-items:center; }
  .msg-text { white-space: pre-wrap; }
  .msg img.att { max-width: 100%; border-radius:10px; margin-bottom:6px; display:block; }
  .msg a.att-file { display:flex; align-items:center; gap:6px; font-size:13px; text-decoration:underline; margin-bottom:4px; }
  .msg .del-btn { background:none; border:none; color:inherit; opacity:.5; cursor:pointer; font-size:11px; }
  .msg .del-btn:hover { opacity:1; }

  .composer { border-top:1px solid var(--card-border); background: rgba(11,12,42,0.85); backdrop-filter: blur(10px); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); position:relative; }
  .sender-toggle { display:flex; gap:5px; flex-shrink:1; min-width:0; }
  .sender-toggle button { padding:6px 10px; border-radius:16px; border:1px solid var(--card-border); background:rgba(255,255,255,0.05); color:var(--muted); font-family:'Quicksand',sans-serif; font-weight:700; font-size:11px; cursor:pointer; white-space:nowrap; }
  .sender-toggle button.active.io { background: var(--gold); color:#2a1c00; border-color:var(--gold); }
  .sender-toggle button.active.luna { background: var(--violet-light); color:#1a1240; border-color:var(--violet-light); }

  .input-row { display:flex; align-items:flex-end; gap:8px; }
  .controls-row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .video-call-pill {
    display:flex; align-items:center; gap:4px; height:34px; padding:0 12px; border-radius:17px;
    background: rgba(89,214,148,0.18); border:1px solid rgba(89,214,148,0.4); color:#59d694;
    font-family:'Quicksand',sans-serif; font-weight:700; font-size:12px; text-decoration:none; white-space:nowrap;
  }
  .video-call-pill:hover { background: rgba(89,214,148,0.28); }
  .input-icons-row { display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .input-icons-row .icon-btn { width:34px; height:34px; font-size:15px; }
  .input-row .msg-input-editable {
    flex:1; max-height:100px; min-height:42px; overflow-y:auto;
    background: rgba(255,255,255,0.08); border:1px solid var(--card-border); border-radius:20px;
    color:var(--text); font-family:'Quicksand',sans-serif; font-size:16px; line-height:1.4;
    padding:10px 14px; outline:none; box-sizing:border-box; word-break:break-word;
  }
  .msg-input-editable:empty:before {
    content: attr(data-placeholder); color: var(--muted); pointer-events:none;
  }
  .msg-input-editable .composer-emoji { display:inline-block; vertical-align:-6px; margin:0 1px; }
  .msg-input-editable .composer-emoji svg { width:20px; height:20px; }
  .icon-btn { width:42px; height:42px; border-radius:50%; border:1px solid var(--card-border); background: rgba(255,255,255,0.08); color:var(--text); font-size:18px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .send-btn { background: linear-gradient(135deg, var(--gold), #f0a93a); color:#2a1c00; border:none; }
  #mic-btn.recording { background: #e0475f; border-color:#e0475f; animation: micPulse 1.1s ease-in-out infinite; }
  @keyframes micPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,71,95,0.55); } 50% { box-shadow: 0 0 0 8px rgba(224,71,95,0); } }
  .rec-timer { font-size:11px; color:#e0475f; font-weight:700; align-self:center; min-width:30px; }

  .emoji-panel {
    position:absolute; bottom: 100%; left:12px; right:12px;
    background: rgba(21,18,56,0.97); border:1px solid var(--card-border); border-radius:16px;
    padding: 10px; display:none; grid-template-columns: repeat(8, 1fr); gap:4px; max-height:160px; overflow-y:auto;
    margin-bottom:8px;
  }
  .emoji-panel.open { display:grid; }
  .emoji-panel button { background:none; border:none; font-size:20px; padding:6px; cursor:pointer; border-radius:8px; display:flex; align-items:center; justify-content:center; }
  .emoji-panel button:hover { background: rgba(255,255,255,0.1); }
  .emoji-panel button.moon-emoji-btn { background: rgba(255,255,255,0.04); }

  .attach-preview { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,0.08); border-radius:12px; padding:6px 10px; margin-bottom:8px; font-size:12px; display:none; }
  .attach-preview.show { display:flex; }
  .attach-preview button { margin-left:auto; background:none; border:none; color:var(--muted); cursor:pointer; }

  .notif-bar {
    display:flex; align-items:center; gap:8px; padding:8px 16px;
    background: rgba(246,196,83,0.1); border-bottom:1px solid var(--card-border);
    font-size:12px; color: var(--muted);
  }
  .notif-bar button {
    background: rgba(246,196,83,0.2); color: var(--gold); border:none; border-radius:16px;
    padding:5px 12px; font-family:'Quicksand',sans-serif; font-weight:700; font-size:11px; cursor:pointer;
    margin-left:auto; white-space:nowrap;
  }

  .msg-quote {
    border-left: 3px solid rgba(255,255,255,0.4); padding: 4px 8px; margin-bottom: 6px;
    font-size: 12px; opacity: 0.8; border-radius: 4px; background: rgba(0,0,0,0.12);
  }
  .meta .reply-btn {
    background:none; border:none; color:inherit; opacity:.6; cursor:pointer; font-size:11px; margin-right: 2px;
  }
  .meta .reply-btn:hover { opacity: 1; }
  .meta .edit-btn {
    background:none; border:none; color:inherit; opacity:.5; cursor:pointer; font-size:11px; margin-right: 2px;
  }
  .meta .edit-btn:hover { opacity: 1; }
  .seen-tick { font-size:10px; opacity:.75; color:#59d694; }
  .edited-label { font-size:10px; opacity:.55; margin-left:4px; font-style:italic; }
  .edit-area { margin-top:6px; }
  .edit-textarea {
    width:100%; box-sizing:border-box; background: rgba(0,0,0,0.2); border:1px solid var(--card-border);
    border-radius:10px; color:var(--text); font-family:'Quicksand',sans-serif; font-size:13px;
    padding:8px 10px; resize:none; min-height:60px;
  }
  .edit-btns { display:flex; gap:6px; margin-top:5px; }
  .edit-save-btn, .edit-cancel-btn {
    padding:5px 12px; border-radius:10px; border:none; cursor:pointer;
    font-family:'Quicksand',sans-serif; font-size:12px; font-weight:700;
  }
  .edit-save-btn { background: var(--gold); color:#2a1c00; }
  .edit-cancel-btn { background: rgba(255,255,255,0.1); color:var(--text); }
  .reply-preview-bar {
    display:none; align-items:center; gap:8px; background: rgba(255,255,255,0.08);
    border-left: 3px solid var(--gold); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; font-size: 12px;
  }
  .reply-preview-bar.show { display:flex; }
  .reply-preview-bar span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reply-preview-bar button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; }

  .chat-link { color: inherit; text-decoration: underline; word-break: break-all; }
</style>
</head>
<body>

<div class="app-content">
  <div class="topbar">
    <div class="topbar-logo">
      <span class="moon-icon">🌙</span>
      <span class="logo-text">Luna</span>
    </div>
    <div class="topbar-nav">
      <a href="/">Home</a>
      <a href="/moduli.html">Words</a>

    <button class="topbar-exit" id="topbar-exit-btn" title="Exit">⏏ Exit</button>

  <div class="chat-wrap">

    <div class="composer">

          <button class="icon-btn" id="attach-btn">📎</button>

             data-placeholder="Write a message..." autocapitalize="off" autocorrect="off" spellcheck="false"></div>

  <div class="bottom-nav">
    <a href="/"><span class="bn-icon">🌙</span>Home</a>
    <a href="/moduli.html"><span class="bn-icon">📚</span>Words</a>
    <a href="/moduli.html?cat=grammar"><span class="bn-icon">✏️</span>Grammar</a>
    <a href="/moduli.html?cat=verbs"><span class="bn-icon">📖</span>Verbs</a>
    <a href="/liste.html"><span class="bn-icon">🔊</span>Lists</a>
    <a href="/chat.html" class="active"><span class="bn-icon">💬<span class="chat-badge"></span></span>Chat</a>

<script src="/js/starfield.js"></script>
<script src="/js/moon-emojis.js"></script>
<script src="/js/chat-shared.js"></script>
<script>

let currentSender = localStorage.getItem('luna_device_owner') || 'luna';
let pendingFile = null;

const chatLog = document.getElementById('chat-log');
const emojiPanel = document.getElementById('emoji-panel');
const msgInput = document.getElementById('msg-input');
const attachPreview = document.getElementById('attach-preview');
const attachName = document.getElementById('attach-name');
const fileInput = document.getElementById('file-input');

const emojiButtonsHtml =
  MOON_EMOJIS.map(m => `<button type="button" class="moon-emoji-btn" data-code="${m.code}" title="${m.label}">${m.svg}</button>`).join('');
emojiPanel.innerHTML = emojiButtonsHtml;
emojiPanel.querySelectorAll('button').forEach(btn => {
  btn.addEventListener('click', () => {
    insertEmojiAtCursor(btn.dataset.code, btn.innerHTML);
  });
});
document.getElementById('emoji-toggle').addEventListener('click', () => {
  emojiPanel.classList.toggle('open');
});

// Inserisce il disegno dell'emoji nel punto esatto dove si trova il cursore
function insertEmojiAtCursor(code, svgHtml) {
  msgInput.focus();
  const sel = window.getSelection();
  let range;
  if (sel.rangeCount > 0 && msgInput.contains(sel.anchorNode)) {
    range = sel.getRangeAt(0);
  } else {
    range = document.createRange();
    range.selectNodeContents(msgInput);
    range.collapse(false);
  }
  range.deleteContents();
  const span = document.createElement('span');
  span.className = 'composer-emoji';
  span.contentEditable = 'false';
  span.dataset.code = code;
  span.innerHTML = svgHtml;
  range.insertNode(span);
  range.setStartAfter(span);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

// Ricostruisce il testo con i codici emoji (es. :moon_happy:) da inviare al server,
// leggendo sia il testo scritto sia i disegni inseriti
function getComposerText() {
  let text = '';
  function walk(node) {
    if (node.nodeType === Node.TEXT_NODE) {
      text += node.nodeValue;
    } else if (node.nodeType === Node.ELEMENT_NODE) {
      if (node.dataset && node.dataset.code) {
        text += node.dataset.code;
      } else if (node.tagName === 'BR') {
        text += '\n';
      } else if (node.tagName === 'DIV' || node.tagName === 'P') {
        if (text.length > 0 && !text.endsWith('\n')) text += '\n';
        node.childNodes.forEach(walk);
      } else {
        node.childNodes.forEach(walk);
      }
    }
  }
  msgInput.childNodes.forEach(walk);
  return text.trim();
}

document.querySelectorAll('.sender-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    currentSender = btn.dataset.sender;
    document.querySelectorAll('.sender-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadVideoCallLink();
  });
});

document.getElementById('attach-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) {
    pendingFile = fileInput.files[0];
    attachName.textContent = '📎 ' + pendingFile.name;
    attachPreview.classList.add('show');
  }
});
document.getElementById('attach-remove').addEventListener('click', () => {
  pendingFile = null; fileInput.value = '';
  attachPreview.classList.remove('show');
});

// ── Messaggi vocali ──
let mediaRecorder = null;
let audioChunks = [];
let recStream = null;
let recTimerInterval = null;
let recSeconds = 0;
const micBtn = document.getElementById('mic-btn');

async function startRecording() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    alert("Voice recording isn't supported on this browser.");
    return;
  }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert("Couldn't access the microphone. Check your browser/site permissions.");
    return;
  }
  audioChunks = [];
  const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
  mediaRecorder = new MediaRecorder(recStream, mimeType ? { mimeType } : undefined);
  mediaRecorder.addEventListener('dataavailable', e => { if (e.data.size > 0) audioChunks.push(e.data); });
  mediaRecorder.addEventListener('stop', () => {
    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
    const ext = blob.type.includes('mp4') ? 'm4a' : (blob.type.includes('ogg') ? 'ogg' : 'webm');
    pendingFile = new File([blob], `voice-message.${ext}`, { type: blob.type });
    attachName.textContent = '🎤 Voice message (' + recSeconds + 's)';
    attachPreview.classList.add('show');
    recStream.getTracks().forEach(t => t.stop());
  });
  mediaRecorder.start();
  recSeconds = 0;
  micBtn.classList.add('recording');
  micBtn.textContent = '⏹️';
  recTimerInterval = setInterval(() => { recSeconds++; }, 1000);
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  clearInterval(recTimerInterval);
  micBtn.classList.remove('recording');
  micBtn.textContent = '🎤';
}

micBtn.addEventListener('click', () => {
  if (micBtn.classList.contains('recording')) stopRecording();
  else startRecording();
});

function fmtTime(iso) {
  const d = new Date(iso + 'Z');
  return d.toLocaleString('it-IT', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}

const messagesById = {};
let readStatus = {}; // { io: lastReadId, luna: lastReadId }
let lastReadStatusKey = ''; // stringa per rilevare cambiamenti

async function updateReadStatus() {
  try {
    readStatus = await fetch('/api/chat/read-status').then(r => r.json());
  } catch(e) {}
}

async function markAllRead() {
  const msgs = Object.values(messagesById);
  if (!msgs.length) return;
  const maxId = Math.max(...msgs.map(m => m.id));
  try {
    await fetch('/api/chat/read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ device: currentSender, last_read_id: maxId })
    });
    readStatus[currentSender] = maxId;
  } catch(e) {}
}

function renderMsg(m) {
  messagesById[m.id] = m;
  const div = document.createElement('div');
  div.className = 'msg ' + m.sender;
  let attHtml = '';
  if (m.attachment_path) {
    if (m.attachment_type && m.attachment_type.startsWith('image/')) {
      attHtml = `<img class="att" src="${m.attachment_path}" alt="${m.attachment_name}">`;
    } else if (m.attachment_type && m.attachment_type.startsWith('audio/')) {
      attHtml = `<audio class="att-audio" controls src="${m.attachment_path}"></audio>`;
    } else {
      attHtml = `<a class="att-file" href="${m.attachment_path}" target="_blank">📎 ${m.attachment_name}</a>`;
    }
  }

  let quoteHtml = '';
  if (m.reply_to_id && messagesById[m.reply_to_id]) {
    const orig = messagesById[m.reply_to_id];
    const originalWho = orig.sender === 'io' ? 'Tak' : 'Luna';
    const snippet = orig.text ? orig.text.slice(0, 60) : (orig.attachment_name ? '📎 ' + orig.attachment_name : '');
    quoteHtml = `<div class="msg-quote"><b>${originalWho}</b>: ${snippet.replace(/</g,'&lt;')}</div>`;
  }

  // "Seen" — visibile solo sui propri messaggi, quando l'altro li ha letti
  const seenHtml = (m.sender === currentSender && readStatus[m.sender === 'io' ? 'luna' : 'io'] >= m.id)
    ? '<span class="seen-tick">✓ Seen</span>' : '';

  const editedLabel = m.edited ? '<span class="edited-label">(edited)</span>' : '';

  div.innerHTML = `
    ${quoteHtml}
    ${attHtml}
    ${m.text ? `<div class="msg-text">${chatFormatText(m.text.trim())}${editedLabel}</div>` : ''}
    <div class="edit-area" style="display:none;">
      <textarea class="edit-textarea"></textarea>
      <div class="edit-btns">
        <button class="edit-save-btn">Save</button>
        <button class="edit-cancel-btn">Cancel</button>
      </div>
    </div>
    <div class="meta">
      <span>${fmtTime(m.created_at)}</span>
      ${seenHtml}
      <button class="reply-btn" data-id="${m.id}">↩️ reply</button>
      ${m.text ? `<button class="edit-btn" data-id="${m.id}">✏️ edit</button>` : ''}
      <button class="del-btn" data-id="${m.id}">delete</button>
    </div>
  `;
  div.querySelector('.del-btn').addEventListener('click', async () => {
    await fetch('/api/chat/messages/' + m.id, { method: 'DELETE' });
    div.remove();
    lastMsgCount = Math.max(0, lastMsgCount - 1);
  });
  div.querySelector('.reply-btn').addEventListener('click', () => startReply(m));

  const editBtn = div.querySelector('.edit-btn');
  if (editBtn) {
    editBtn.addEventListener('click', () => {
      const textDiv = div.querySelector('.msg-text');
      const editArea = div.querySelector('.edit-area');
      const editTA = div.querySelector('.edit-textarea');
      editTA.value = m.text || '';
      textDiv.style.display = 'none';
      editArea.style.display = 'block';
      editTA.focus();
    });
    div.querySelector('.edit-cancel-btn').addEventListener('click', () => {
      div.querySelector('.msg-text').style.display = '';
      div.querySelector('.edit-area').style.display = 'none';
    });
    div.querySelector('.edit-save-btn').addEventListener('click', async () => {
      const newText = div.querySelector('.edit-textarea').value.trim();
      if (!newText) return;
      const updated = await fetch('/api/chat/messages/' + m.id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: newText })
      }).then(r => r.json());
      m.text = updated.text;
      m.edited = updated.edited;
      const textDiv = div.querySelector('.msg-text');
      textDiv.innerHTML = chatFormatText(newText.trim()) + '<span class="edited-label">(edited)</span>';
      textDiv.style.display = '';
      div.querySelector('.edit-area').style.display = 'none';
      if (newText) chatAttachPreview(newText, div);
    });
  }

  chatLog.appendChild(div);
  if (m.text) chatAttachPreview(m.text, div);
}

function startReply(m) {
  replyingTo = m;
  const who = m.sender === 'io' ? 'Tak' : 'Luna';
  const snippet = m.text ? m.text.slice(0, 50) : (m.attachment_name ? '📎 ' + m.attachment_name : '');
  document.getElementById('reply-preview-text').textContent = `Replying to ${who}: ${snippet}`;
  document.getElementById('reply-preview-bar').classList.add('show');
  msgInput.focus();
}
function cancelReply() {
  replyingTo = null;
  document.getElementById('reply-preview-bar').classList.remove('show');
}

let lastMsgCount = -1;
let lastMsgId = -1;
let replyingTo = null;

async function loadMessages(force) {
  await updateReadStatus();
  const msgs = await fetch('/api/chat/messages').then(r => r.json());
  const newestId = msgs.length ? msgs[msgs.length - 1].id : 0;
  const newReadKey = JSON.stringify(readStatus);
  const readChanged = newReadKey !== lastReadStatusKey;

  if (!force && msgs.length === lastMsgCount && newestId === lastMsgId && !readChanged) return;

  lastMsgCount = msgs.length;
  lastMsgId = newestId;
  lastReadStatusKey = newReadKey;

  const wasNearBottom = (chatLog.scrollHeight - chatLog.scrollTop - chatLog.clientHeight) < 80;
  chatLog.innerHTML = '';
  msgs.forEach(renderMsg);
  if (force || wasNearBottom) chatLog.scrollTop = chatLog.scrollHeight;
  markChatRead(newestId);
  markAllRead();
}

setInterval(() => loadMessages(false), 5000);
async function sendMessage() {
  const text = getComposerText();
  if (!text && !pendingFile) return;

  const formData = new FormData();
  formData.append('sender', currentSender);
  formData.append('text', text);
  if (pendingFile) formData.append('attachment', pendingFile);
  if (replyingTo) formData.append('reply_to_id', replyingTo.id);

  const res = await fetch('/api/chat/messages', { method: 'POST', body: formData });
  const msg = await res.json();
  renderMsg(msg);
  chatLog.scrollTop = chatLog.scrollHeight;
  lastMsgCount++; lastMsgId = msg.id;
  markChatRead(msg.id);

  msgInput.innerHTML = '';
  pendingFile = null; fileInput.value = '';
  attachPreview.classList.remove('show');
  emojiPanel.classList.remove('open');
  cancelReply();
}
document.getElementById('reply-preview-cancel').addEventListener('click', cancelReply);

document.getElementById('send-btn').addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  } else if (e.key === 'Enter' && e.shiftKey) {
    e.preventDefault();
    document.execCommand('insertLineBreak');
  }
});

loadMessages(true);

// ── Notifiche push ──
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

const notifBtn = document.getElementById('notif-btn');
const notifStatus = document.getElementById('notif-status');
const notifBar = document.getElementById('notif-bar');

async function checkNotifStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    notifBar.style.display = 'none';
    return;
  }
  try {
    const reg = await navigator.serviceWorker.register('/service-worker.js');
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      const owner = localStorage.getItem('luna_notif_owner') || currentSender;
      notifStatus.textContent = `🔔 Notifications on for ${owner === 'io' ? 'Io' : 'Luna'} on this device`;
      notifBtn.textContent = 'Turn off';
      notifBtn.onclick = () => disableNotifications(sub);
    } else {
      notifStatus.textContent = '🔔 Get notified here when a new message arrives';
      notifBtn.textContent = 'Enable';
      notifBtn.onclick = () => enableNotifications();
    }
  } catch (e) {
    notifBar.style.display = 'none';
  }
}

async function enableNotifications() {
  const owner = currentSender; // usa il toggle Io/Luna attualmente selezionato
  try {
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') { alert('Notifications permission was not granted.'); return; }
    const reg = await navigator.serviceWorker.ready;
    const vapidKey = await fetch('/api/push/vapid-public-key').then(r => r.text());
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(vapidKey)
    });
    await fetch('/api/push/subscribe', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ owner, subscription: sub })
    });
    localStorage.setItem('luna_notif_owner', owner);
    checkNotifStatus();
  } catch (e) {
    alert("Couldn't enable notifications on this device/browser.");
  }
}

async function disableNotifications(sub) {
  await fetch('/api/push/unsubscribe', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ endpoint: sub.endpoint })
  });
  await sub.unsubscribe();
  checkNotifStatus();
}

checkNotifStatus();

// ── Videochiamata ──
async function loadVideoCallLink() {
  try {
    const r = await fetch('/api/video-room').then(r => r.json());
    const link = document.getElementById('video-call-link');
    link.href = r.url;
  } catch (e) {}
}
loadVideoCallLink();

// Applica subito il mittente giusto ai pulsanti (in base al dispositivo salvato)
document.querySelectorAll('.sender-toggle button').forEach(b => {
  b.classList.toggle('active', b.dataset.sender === currentSender);
});

// Al primo avvio su questo telefono, chiede una sola volta di chi è
chatEnsureDeviceOwner(owner => {
  currentSender = owner;
  document.querySelectorAll('.sender-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.sender === owner);
  });
  loadVideoCallLink();
});
