<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercise - Luna Italiano</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/theme.css">
<style>
  .opt-btn {
    display:block; width:100%; text-align:left;
    background: rgba(255,255,255,0.07); border:1px solid var(--card-border);
    color: var(--text); font-family:'Quicksand',sans-serif; font-size:15px; font-weight:600;
    padding: 14px 16px; border-radius: 12px; margin-bottom:10px; cursor:pointer;
    transition: all .15s;
  }
  .opt-btn:hover { border-color: var(--violet-light); }
  .opt-btn.correct { background: rgba(89,214,148,0.25); border-color:#59d694; }
  .opt-btn.wrong { background: rgba(230,90,90,0.25); border-color:#e65a5a; }
  .opt-btn:disabled { cursor:default; }

  .prompt-box { text-align:center; padding: 30px 16px; }
  .prompt-box .word { font-size: 28px; font-weight:700; font-family:'Baloo 2',sans-serif; }
  .prompt-box .hint { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px;}

  .match-cols { display:flex; gap: 12px; }
  .match-col { flex:1; display:flex; flex-direction:column; gap:8px; }
  .match-item {
    background: rgba(255,255,255,0.07); border:1px solid var(--card-border);
    padding: 12px 10px; border-radius: 12px; text-align:center;
    font-weight:600; cursor:pointer; font-size:14px; transition: all .15s;
  }
  .match-item.selected { border-color: var(--gold); background: rgba(246,196,83,0.15); }
  .match-item.matched { border-color:#59d694; background: rgba(89,214,148,0.2); cursor:default; opacity:.7; }
  .match-item.wrong-flash { border-color:#e65a5a; background: rgba(230,90,90,0.25); }

  .progress-bar-outer { height:6px; border-radius:4px; background: rgba(255,255,255,0.1); overflow:hidden; margin-bottom:18px; }
  .progress-bar-inner { height:100%; background: linear-gradient(90deg, var(--gold), var(--pink)); transition: width .25s; }

  .tense-tabs { display:flex; gap:6px; margin-bottom:12px; }
  .tense-tabs button {
    flex:1; padding:8px; border-radius:14px; border:1px solid var(--card-border);
    background: rgba(255,255,255,0.05); color: var(--muted);
    font-family:'Quicksand',sans-serif; font-weight:700; font-size:12px; cursor:pointer;
  }
  .tense-tabs button.active { background: var(--gold); color:#2a1c00; border-color:var(--gold); }
  .conj-table { width:100%; border-collapse:collapse; margin-bottom:6px; }
  .conj-table tr { border-bottom: 1px solid var(--card-border); }
  .conj-table tr:last-child { border-bottom:none; }
  .conj-table td { padding: 10px 6px; font-size:14px; }
  .conj-table td.pron { color: var(--muted); font-weight:600; width:40%; }
  .conj-table td.form { font-weight:700; font-family:'Baloo 2',sans-serif; }
  .conj-stem { color: var(--silver); }
  .conj-ending { color: var(--gold); font-weight:800; }

  .write-prompt { text-align:center; padding: 10px 4px 20px; }
  .write-prompt .hint { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .write-prompt .word { font-size:19px; font-weight:700; font-family:'Baloo 2',sans-serif; }
  .write-input {
    width:100%; background: rgba(255,255,255,0.08); border:1px solid var(--card-border); border-radius:14px;
    color: var(--text); font-family:'Quicksand',sans-serif; font-size:16px; padding:12px 16px;
    margin: 16px 0 12px; text-align:center;
  }
  .write-input.correct { border-color:#59d694; background: rgba(89,214,148,0.15); }
  .write-input.wrong { border-color:#e65a5a; background: rgba(230,90,90,0.15); }
  .write-feedback { font-size:13px; margin-bottom:14px; min-height:18px; }
  .write-feedback.ok { color:#59d694; }
  .write-feedback.no { color:#e65a5a; }

  /* ── Il/La drag & drop ── */
  .gender-zones { display:flex; gap:12px; margin-bottom:26px; }
  .gender-zone {
    flex:1; height:100px; border-radius:16px; border:2px dashed var(--card-border);
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px;
    font-family:'Baloo 2',sans-serif; font-size:20px; font-weight:700; color:var(--muted);
    transition: all .15s;
  }
  .gender-zone.il { border-color: rgba(95,184,224,0.4); }
  .gender-zone.la { border-color: rgba(242,160,196,0.4); }
  .gender-zone.hover.il { background: rgba(95,184,224,0.18); border-color:#5fb8e0; color:#5fb8e0; }
  .gender-zone.hover.la { background: rgba(242,160,196,0.18); border-color:#f2a0c4; color:#f2a0c4; }
  .gender-zone .gz-sub { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
  .gender-chip-wrap { display:flex; justify-content:center; padding: 10px 0 20px; touch-action: none; }
  .gender-chip {
    padding: 18px 34px; border-radius: 20px; background: linear-gradient(135deg, var(--gold), #f0a93a);
    color:#2a1c00; font-family:'Baloo 2',sans-serif; font-weight:700; font-size:19px;
    cursor: grab; user-select:none; box-shadow: 0 6px 18px rgba(0,0,0,0.35);
    position: relative; z-index: 5; touch-action:none;
  }
  .gender-chip.dragging { cursor: grabbing; transition:none !important; }
  .gender-tap-btns { display:flex; gap:12px; }
  .gender-tap-btns button {
    flex:1; padding:12px; border-radius:14px; border:1px solid var(--card-border);
    background: rgba(255,255,255,0.06); color:var(--text); font-family:'Baloo 2',sans-serif;
    font-weight:700; font-size:16px; cursor:pointer;
  }

  /* ── Sentence builder ── */
  .sb-prompt { text-align:center; font-size:16px; font-weight:700; margin-bottom:16px; }
  .sb-answer-row {
    min-height: 52px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;
    border-bottom: 2px solid var(--card-border); padding-bottom: 14px; margin-bottom: 18px;
  }
  .sb-bank { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:18px; }
  .sb-chip {
    padding: 9px 14px; border-radius:14px; background: rgba(255,255,255,0.08); border:1px solid var(--card-border);
    color:var(--text); font-family:'Quicksand',sans-serif; font-weight:700; font-size:14px; cursor:pointer;
  }
  .sb-chip.placed { background: rgba(246,196,83,0.22); border-color: var(--gold); }

  /* ── Cloze ── */
  .cloze-sentence { font-size:17px; line-height:1.6; text-align:center; margin-bottom:18px; }
  .cloze-blank {
    display:inline-block; min-width:90px; border-bottom:2px solid var(--gold);
    text-align:center; font-weight:700; color:var(--gold); padding: 0 4px;
  }
</style>
</head>
<body>

<div class="app-content">
  <div class="topbar">
    <div class="topbar-logo">
      <span class="moon-icon">🌙</span>
      <span class="logo-text">Luna</span>
    </div>
    <div class="topbar-nav">
      <a href="/">Home</a>
      <a href="/moduli.html" class="active">Words</a>
      <a href="/moduli.html?cat=grammar">Grammar</a>
      <a href="/moduli.html?cat=verbs">Verbs</a>
      <a href="/liste.html">Lists</a>
      <a href="/chat.html">Chat<span class="chat-badge"></span></a>
    
    <button class="topbar-exit" id="topbar-exit-btn" title="Exit">⏏ Exit</button>
    </div>
  </div>

  <div class="main" id="main">Loading... 🌙</div>

  <div class="bottom-nav">
    <a href="/"><span class="bn-icon">🌙</span>Home</a>
    <a href="/moduli.html" class="active"><span class="bn-icon">📚</span>Words</a>
    <a href="/moduli.html?cat=grammar"><span class="bn-icon">✏️</span>Grammar</a>
    <a href="/moduli.html?cat=verbs"><span class="bn-icon">📖</span>Verbs</a>
    <a href="/liste.html"><span class="bn-icon">🔊</span>Lists</a>
    <a href="/chat.html"><span class="bn-icon">💬<span class="chat-badge"></span></span>Chat</a>
    <button class="bn-exit" id="bn-exit-btn" title="Exit app"><span class="bn-icon">⏏</span>Exit</button>
  </div>
</div>

<script src="/js/starfield.js"></script>
<script src="/js/moon-emojis.js"></script>
<script src="/js/chat-shared.js"></script>
<script>
const params = new URLSearchParams(location.search);
const moduloId = params.get('modulo');
const esercizioId = params.get('esercizio');
const main = document.getElementById('main');

let score = { ok: 0, total: 0 };

async function load() {
  const mod = await fetch('/api/modules/' + moduloId).then(r => r.json());
  const ex = mod.exercises.find(e => e.id === esercizioId);
  if (!ex) { main.innerHTML = '<p>Exercise not found.</p>'; return; }

  if (ex.type === 'scelta_multipla') runSceltaMultipla(mod, ex);
  else if (ex.type === 'abbinamento') runAbbinamento(mod, ex);
  else if (ex.type === 'coniugazione') runConiugazione(mod, ex);
  else if (ex.type === 'genere_dnd') runGenereDnd(mod, ex);
  else if (ex.type === 'costruttore') runCostruttore(mod, ex);
  else if (ex.type === 'cloze') runCloze(mod, ex);
}

function header(mod, ex, currentIdx, totalIdx) {
  const pct = totalIdx ? Math.round((currentIdx / totalIdx) * 100) : 0;
  return `
    <h2 style="font-size:16px; margin-bottom:4px;">${mod.icon} ${mod.title}</h2>
    <p style="font-size:13px; color:var(--muted); margin-bottom:10px;">${ex.title} · ${ex.instructions}</p>
    <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pct}%"></div></div>
  `;
}

async function saveProgress(moduleId, exerciseId, itemId, correct) {
  try {
    await fetch('/api/progress', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ module_id: moduleId, exercise_id: exerciseId, item_id: itemId, correct })
    });
  } catch(e) {}
}

function finalScreen(mod, ex) {
  main.innerHTML = `
    <div class="card" style="text-align:center; padding:36px 20px;">
      <div style="font-size:46px; margin-bottom:8px;">🌠</div>
      <h2 style="margin-bottom:6px;">Exercise complete!</h2>
      <p style="color:var(--muted); margin-bottom:20px;">${score.ok} correct answers out of ${score.total}</p>
      <a href="/moduli.html?open=${mod.id}" class="btn btn-primary btn-block" style="margin-bottom:10px;">Back to modules</a>
      <a href="/" class="btn btn-ghost btn-block">Back to home</a>
    </div>`;
}

// ── Scelta multipla ──
function runSceltaMultipla(mod, ex) {
  let idx = 0;
  const items = [...ex.items].sort(() => Math.random() - 0.5);

  function renderItem() {
    if (idx >= items.length) { finalScreen(mod, ex); return; }
    const item = items[idx];
    const opts = [...item.options].sort(() => Math.random() - 0.5);
    main.innerHTML = header(mod, ex, idx, items.length) + `
      <div class="card">
        <div class="prompt-box">
          <div class="hint">How do you say it in Italian?</div>
          <div class="word">${item.prompt}</div>
        </div>
        <div id="opts"></div>
      </div>`;
    const optsBox = document.getElementById('opts');
    optsBox.innerHTML = opts.map(o => `<button class="opt-btn" data-val="${o}">${o}</button>`).join('');
    optsBox.querySelectorAll('.opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const chosen = btn.dataset.val;
        const correct = chosen === item.answer;
        optsBox.querySelectorAll('.opt-btn').forEach(b => {
          b.disabled = true;
          if (b.dataset.val === item.answer) b.classList.add('correct');
          else if (b === btn) b.classList.add('wrong');
        });
        score.total++; if (correct) score.ok++;
        saveProgress(mod.id, ex.id, item.id, correct);
        setTimeout(() => { idx++; renderItem(); }, 900);
      });
    });
  }
  renderItem();
}

// ── Abbinamento ──
function runAbbinamento(mod, ex) {
  const pairs = ex.pairs;
  const left = [...pairs].sort(() => Math.random() - 0.5);
  const right = [...pairs].sort(() => Math.random() - 0.5);
  let selectedLeft = null, selectedRight = null, matchedCount = 0;

  main.innerHTML = header(mod, ex, 0, pairs.length) + `
    <div class="card">
      <div class="match-cols">
        <div class="match-col" id="col-left"></div>
        <div class="match-col" id="col-right"></div>
      </div>
    </div>`;

  const colLeft = document.getElementById('col-left');
  const colRight = document.getElementById('col-right');
  colLeft.innerHTML = left.map(p => `<div class="match-item" data-id="${p.id}" data-side="l">${p.it}</div>`).join('');
  colRight.innerHTML = right.map(p => `<div class="match-item" data-id="${p.id}" data-side="r">${p.en}</div>`).join('');

  function checkPair() {
    if (!selectedLeft || !selectedRight) return;
    const correct = selectedLeft.dataset.id === selectedRight.dataset.id;
    score.total++;
    if (correct) {
      score.ok++;
      matchedCount++;
      selectedLeft.classList.remove('selected'); selectedLeft.classList.add('matched');
      selectedRight.classList.remove('selected'); selectedRight.classList.add('matched');
      saveProgress(mod.id, ex.id, selectedLeft.dataset.id, true);
      selectedLeft = null; selectedRight = null;
      if (matchedCount === pairs.length) setTimeout(() => finalScreen(mod, ex), 700);
    } else {
      saveProgress(mod.id, ex.id, selectedLeft.dataset.id, false);
      selectedLeft.classList.add('wrong-flash');
      selectedRight.classList.add('wrong-flash');
      setTimeout(() => {
        selectedLeft.classList.remove('selected', 'wrong-flash');
        selectedRight.classList.remove('selected', 'wrong-flash');
        selectedLeft = null; selectedRight = null;
      }, 600);
    }
  }

  document.querySelectorAll('.match-item').forEach(el => {
    el.addEventListener('click', () => {
      if (el.classList.contains('matched')) return;
      const side = el.dataset.side;
      if (side === 'l') {
        if (selectedLeft) selectedLeft.classList.remove('selected');
        selectedLeft = el; el.classList.add('selected');
      } else {
        if (selectedRight) selectedRight.classList.remove('selected');
        selectedRight = el; el.classList.add('selected');
      }
      checkPair();
    });
  });
}

// ── Coniugazione: tabella + scrittura con correzione ──
function normalizeAnswer(s) {
  return s.toLowerCase().trim().replace(/[.!?,;]+$/g, '').replace(/\s+/g, ' ');
}

// ── Colora le tabelle di coniugazione: radice fissa vs parte che cambia ──
const REFLEXIVE_PRONOUNS = ['mi', 'ti', 'si', 'ci', 'vi'];

function colorEndingRow(rows) {
  // Toglie l'eventuale pronome riflessivo iniziale, trova la radice comune tra le 6 forme,
  // colora la parte finale (la desinenza, che cambia da persona a persona).
  const prefixes = {}, stripped = {};
  Object.entries(rows).forEach(([pron, form]) => {
    const sp = form.split(' ');
    if (REFLEXIVE_PRONOUNS.includes(sp[0])) {
      prefixes[pron] = sp[0] + ' ';
      stripped[pron] = sp.slice(1).join(' ');
    } else {
      prefixes[pron] = '';
      stripped[pron] = form;
    }
  });
  const vals = Object.values(stripped);
  let lcp = vals[0] || '';
  for (let i = 1; i < vals.length; i++) {
    while (lcp && !vals[i].startsWith(lcp)) lcp = lcp.slice(0, -1);
  }
  const out = {};
  Object.keys(rows).forEach(pron => {
    const rest = stripped[pron].slice(lcp.length);
    out[pron] = `${prefixes[pron]}<span class="conj-stem">${lcp}</span><span class="conj-ending">${rest}</span>`;
  });
  return out;
}

function colorPassatoRow(rows) {
  // Nel passato prossimo la parte che cambia e' l'ausiliare (ho/hai/ha.../sono/sei/e'...),
  // non la desinenza finale: colora il primo pezzo (dopo l'eventuale pronome riflessivo).
  const out = {};
  Object.entries(rows).forEach(([pron, form]) => {
    const parts = form.split(' ');
    if (REFLEXIVE_PRONOUNS.includes(parts[0])) {
      out[pron] = `${parts[0]} <span class="conj-ending">${parts[1]}</span> ${parts.slice(2).join(' ')}`;
    } else {
      out[pron] = `<span class="conj-ending">${parts[0]}</span> ${parts.slice(1).join(' ')}`;
    }
  });
  return out;
}

function runConiugazione(mod, ex) {
  const tenseLabels = { presente: 'Present', passato_prossimo: 'Past', futuro_semplice: 'Future' };
  const tenseKeys = Object.keys(ex.table);
  let activeTense = tenseKeys[0];

  function renderStudy() {
    main.innerHTML = header(mod, ex, 0, ex.writing.length) + `
      <div class="card">
        <h3 style="font-size:16px; margin-bottom:10px;">${ex.title}</h3>
        <div class="tense-tabs" id="tense-tabs"></div>
        <table class="conj-table" id="conj-table"></table>
        <button class="btn btn-primary btn-block" id="start-writing" style="margin-top:14px;">✍️ Start writing practice</button>
      </div>`;

    const tabs = document.getElementById('tense-tabs');
    tabs.innerHTML = tenseKeys.map(k => `<button data-tense="${k}" class="${k===activeTense?'active':''}">${tenseLabels[k] || k}</button>`).join('');
    tabs.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => { activeTense = btn.dataset.tense; renderStudy(); });
    });

    const table = document.getElementById('conj-table');
    const rows = ex.table[activeTense];
    const colored = activeTense === 'passato_prossimo' ? colorPassatoRow(rows) : colorEndingRow(rows);
    table.innerHTML = Object.entries(colored).map(([pron, formHtml]) => `
      <tr><td class="pron">${pron}</td><td class="form">${formHtml}</td></tr>
    `).join('');

    document.getElementById('start-writing').addEventListener('click', () => { idx = 0; renderWriting(); });
  }

  let idx = 0;
  function renderWriting() {
    if (idx >= ex.writing.length) { finalScreen(mod, ex); return; }
    const item = ex.writing[idx];
    main.innerHTML = header(mod, ex, idx, ex.writing.length) + `
      <div class="card">
        <div class="write-prompt">
          <div class="hint">Write in Italian</div>
          <div class="word">${item.prompt}</div>
          <input type="text" class="write-input" id="write-input" placeholder="Type your answer...">
          <div class="write-feedback" id="write-feedback"></div>
          <button class="btn btn-primary btn-block" id="check-btn">Check</button>
        </div>
      </div>`;

    const input = document.getElementById('write-input');
    const feedback = document.getElementById('write-feedback');
    const checkBtn = document.getElementById('check-btn');
    input.focus();

    function check() {
      const val = normalizeAnswer(input.value);
      const accepted = item.accepted.map(normalizeAnswer);
      const correct = accepted.includes(val);
      input.disabled = true;
      input.classList.add(correct ? 'correct' : 'wrong');
      feedback.className = 'write-feedback ' + (correct ? 'ok' : 'no');
      feedback.textContent = correct ? '✅ Correct!' : `Not quite — a good answer: "${item.accepted[0]}"`;
      score.total++; if (correct) score.ok++;
      saveProgress(mod.id, ex.id, item.id, correct);
      checkBtn.textContent = 'Continue →';
      checkBtn.onclick = () => { idx++; renderWriting(); };
    }
    checkBtn.onclick = check;
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); if (!input.disabled) check(); }
    });
  }

  renderStudy();
}

// ── Il/La: drag & drop (con fallback a tasti per accessibilita') ──
function runGenereDnd(mod, ex) {
  let idx = 0;
  const items = [...ex.items].sort(() => Math.random() - 0.5);

  function renderItem() {
    if (idx >= items.length) { finalScreen(mod, ex); return; }
    const item = items[idx];
    main.innerHTML = header(mod, ex, idx, items.length) + `
      <div class="card">
        <div class="gender-zones">
          <div class="gender-zone il" id="zone-il">IL <span class="gz-sub">masculine</span></div>
          <div class="gender-zone la" id="zone-la">LA <span class="gz-sub">feminine</span></div>
        </div>
        <div class="gender-chip-wrap">
          <div class="gender-chip" id="gender-chip">${item.word}</div>
        </div>
        <div class="gender-tap-btns">
          <button type="button" data-g="il">👉 IL</button>
          <button type="button" data-g="la">👈 LA</button>
        </div>
      </div>`;

    const chip = document.getElementById('gender-chip');
    const zoneIl = document.getElementById('zone-il');
    const zoneLa = document.getElementById('zone-la');
    let done = false;

    function resolve(chosen) {
      if (done) return;
      done = true;
      const correct = chosen === item.gender;
      score.total++; if (correct) score.ok++;
      saveProgress(mod.id, ex.id, item.id, correct);
      (chosen === 'il' ? zoneIl : zoneLa).style.background = correct ? 'rgba(89,214,148,0.3)' : 'rgba(230,90,90,0.3)';
      chip.style.opacity = '0';
      setTimeout(() => { idx++; renderItem(); }, 700);
    }

    main.querySelectorAll('.gender-tap-btns button').forEach(b => {
      b.addEventListener('click', () => resolve(b.dataset.g));
    });

    // Drag reale (mouse + touch, via pointer events)
    let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
    chip.addEventListener('pointerdown', e => {
      dragging = true;
      chip.setPointerCapture(e.pointerId);
      chip.classList.add('dragging');
      const r = chip.getBoundingClientRect();
      origX = r.left; origY = r.top;
      startX = e.clientX; startY = e.clientY;
      chip.style.position = 'fixed';
      chip.style.left = origX + 'px';
      chip.style.top = origY + 'px';
      chip.style.width = r.width + 'px';
    });
    chip.addEventListener('pointermove', e => {
      if (!dragging) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      chip.style.left = (origX + dx) + 'px';
      chip.style.top = (origY + dy) + 'px';
      const r = chip.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      [zoneIl, zoneLa].forEach(z => {
        const zr = z.getBoundingClientRect();
        const over = cx >= zr.left && cx <= zr.right && cy >= zr.top && cy <= zr.bottom;
        z.classList.toggle('hover', over);
      });
    });
    chip.addEventListener('pointerup', e => {
      if (!dragging) return;
      dragging = false;
      chip.classList.remove('dragging');
      const r = chip.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      const ilR = zoneIl.getBoundingClientRect();
      const laR = zoneLa.getBoundingClientRect();
      zoneIl.classList.remove('hover'); zoneLa.classList.remove('hover');
      if (cx >= ilR.left && cx <= ilR.right && cy >= ilR.top && cy <= ilR.bottom) resolve('il');
      else if (cx >= laR.left && cx <= laR.right && cy >= laR.top && cy <= laR.bottom) resolve('la');
      else {
        // torna al centro se non rilasciata su nessuna zona
        chip.style.position = 'relative';
        chip.style.left = '0'; chip.style.top = '0'; chip.style.width = 'auto';
      }
    });
  }
  renderItem();
}

// ── Sentence Builder: tocca le parole nell'ordine giusto ──
function runCostruttore(mod, ex) {
  let idx = 0;
  const items = ex.items;

  function normalizeSentence(s) {
    return s.toLowerCase().trim().replace(/[.!?,;]+$/g, '').replace(/\s+/g, ' ');
  }

  function renderItem() {
    if (idx >= items.length) { finalScreen(mod, ex); return; }
    const item = items[idx];
    const bank = [...item.words].sort(() => Math.random() - 0.5);
    let placed = [];

    main.innerHTML = header(mod, ex, idx, items.length) + `
      <div class="card">
        <div class="sb-prompt">${item.prompt_en}</div>
        <div class="sb-answer-row" id="sb-answer"></div>
        <div class="sb-bank" id="sb-bank"></div>
        <div class="write-feedback" id="sb-feedback" style="text-align:center;"></div>
        <button class="btn btn-primary btn-block" id="sb-check">Check</button>
      </div>`;

    const answerRow = document.getElementById('sb-answer');
    const bankRow = document.getElementById('sb-bank');
    const feedback = document.getElementById('sb-feedback');
    const checkBtn = document.getElementById('sb-check');

    function renderChips() {
      answerRow.innerHTML = placed.map((bi, i) => `<button type="button" class="sb-chip placed" data-i="${i}">${bank[bi]}</button>`).join('');
      const bankHtml = [];
      bank.forEach((w, bi) => {
        bankHtml.push(`<button type="button" class="sb-chip" data-bi="${bi}">${w}</button>`);
      });
      bankRow.innerHTML = bankHtml.join('');
      bankRow.querySelectorAll('.sb-chip').forEach(btn => {
        const bi = parseInt(btn.dataset.bi, 10);
        if (placed.includes(bi)) btn.style.visibility = 'hidden';
        btn.addEventListener('click', () => {
          placed.push(bi);
          renderChips();
        });
      });
      answerRow.querySelectorAll('.sb-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const i = parseInt(btn.dataset.i, 10);
          placed.splice(i, 1);
          renderChips();
        });
      });
    }
    renderChips();

    function check() {
      const built = placed.map(bi => bank[bi]).join(' ');
      const correct = normalizeSentence(built) === normalizeSentence(item.answer);
      score.total++; if (correct) score.ok++;
      saveProgress(mod.id, ex.id, item.id, correct);
      feedback.className = 'write-feedback ' + (correct ? 'ok' : 'no');
      feedback.textContent = correct ? '✅ Correct!' : `Correct order: "${item.answer}"`;
      checkBtn.textContent = 'Continue →';
      checkBtn.onclick = () => { idx++; renderItem(); };
    }
    checkBtn.onclick = check;
  }
  renderItem();
}

// ── Cloze: completa la frase ──
function runCloze(mod, ex) {
  let idx = 0;
  const items = ex.items;

  function normalizeAnswer(s) {
    return s.toLowerCase().trim().replace(/[.!?,;]+$/g, '');
  }

  function renderItem() {
    if (idx >= items.length) { finalScreen(mod, ex); return; }
    const item = items[idx];
    main.innerHTML = header(mod, ex, idx, items.length) + `
      <div class="card">
        <div class="cloze-sentence">${item.sentence}</div>
        <input type="text" class="write-input" id="cloze-input" placeholder="Type the missing word...">
        <div class="write-feedback" id="cloze-feedback"></div>
        <button class="btn btn-primary btn-block" id="cloze-check">Check</button>
      </div>`;

    const input = document.getElementById('cloze-input');
    const feedback = document.getElementById('cloze-feedback');
    const checkBtn = document.getElementById('cloze-check');
    input.focus();

    function check() {
      const val = normalizeAnswer(input.value);
      const accepted = item.accepted.map(normalizeAnswer);
      const correct = accepted.includes(val);
      input.disabled = true;
      input.classList.add(correct ? 'correct' : 'wrong');
      feedback.className = 'write-feedback ' + (correct ? 'ok' : 'no');
      feedback.textContent = correct ? '✅ Correct!' : `Correct answer: "${item.accepted[0]}"`;
      score.total++; if (correct) score.ok++;
      saveProgress(mod.id, ex.id, item.id, correct);
      checkBtn.textContent = 'Continue →';
      checkBtn.onclick = () => { idx++; renderItem(); };
    }
    checkBtn.onclick = check;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!input.disabled) check(); } });
  }
  renderItem();
}

checkUnreadChat();
