<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Review - Luna Italiano</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/theme.css">
<style>
  .progress-bar-outer { height:6px; border-radius:4px; background: rgba(255,255,255,0.1); overflow:hidden; margin-bottom:18px; }
  .progress-bar-inner { height:100%; background: linear-gradient(90deg, var(--gold), var(--pink)); transition: width .25s; }
  .cloze-sentence { font-size:17px; line-height:1.6; text-align:center; margin-bottom:18px; }
  .cloze-blank {
    display:inline-block; min-width:90px; border-bottom:2px solid var(--gold);
    text-align:center; font-weight:700; color:var(--gold); padding: 0 4px;
  }
  .write-input {
    width:100%; background: rgba(255,255,255,0.08); border:1px solid var(--card-border); border-radius:14px;
    color: var(--text); font-family:'Quicksand',sans-serif; font-size:16px; padding:12px 16px;
    margin: 4px 0 12px; text-align:center;
  }
  .write-input.correct { border-color:#59d694; background: rgba(89,214,148,0.15); }
  .write-input.wrong { border-color:#e65a5a; background: rgba(230,90,90,0.15); }
  .write-feedback { font-size:13px; margin-bottom:14px; min-height:18px; text-align:center; }
  .write-feedback.ok { color:#59d694; }
  .write-feedback.no { color:#e65a5a; }
</style>
</head>
<body>

<div class="app-content">
  <div class="topbar">
    <div class="topbar-logo">
      <span class="moon-icon">🌙</span>
      <span class="logo-text">Luna</span>
    </div>
    <div class="topbar-nav">
      <a href="/">Home</a>
      <a href="/moduli.html">Words</a>
      <a href="/moduli.html?cat=grammar">Grammar</a>
      <a href="/moduli.html?cat=verbs">Verbs</a>
      <a href="/liste.html">Lists</a>
      <a href="/chat.html">Chat<span class="chat-badge"></span></a>
    
    <button class="topbar-exit" id="topbar-exit-btn" title="Exit">⏏ Exit</button>
    </div>
  </div>

  <div class="main" id="main">Loading... 🌙</div>

  <div class="bottom-nav">
    <a href="/"><span class="bn-icon">🌙</span>Home</a>
    <a href="/moduli.html"><span class="bn-icon">📚</span>Words</a>
    <a href="/moduli.html?cat=grammar"><span class="bn-icon">✏️</span>Grammar</a>
    <a href="/moduli.html?cat=verbs"><span class="bn-icon">📖</span>Verbs</a>
    <a href="/liste.html"><span class="bn-icon">🔊</span>Lists</a>
    <a href="/chat.html"><span class="bn-icon">💬<span class="chat-badge"></span></span>Chat</a>
    <button class="bn-exit" id="bn-exit-btn" title="Exit app"><span class="bn-icon">⏏</span>Exit</button>
  </div>
</div>

<script src="/js/starfield.js"></script>
<script src="/js/moon-emojis.js"></script>
<script src="/js/chat-shared.js"></script>
<script>
const main = document.getElementById('main');
let dueItems = [];
let idx = 0;
let score = { ok: 0, total: 0 };

function normalizeAnswer(s) {
  return s.toLowerCase().trim().replace(/[.!?,;]+$/g, '');
}

async function saveProgress(moduleId, exerciseId, itemId, correct) {
  try {
    await fetch('/api/progress', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ module_id: moduleId, exercise_id: exerciseId, item_id: itemId, correct })
    });
  } catch (e) {}
}

async function start() {
  dueItems = await fetch('/api/review/due').then(r => r.json());
  if (!dueItems.length) {
    main.innerHTML = `
      <div class="card" style="text-align:center; padding:40px 20px;">
        <div style="font-size:48px; margin-bottom:10px;">🌙✨</div>
        <h2 style="margin-bottom:8px;">All caught up!</h2>
        <p style="color:var(--muted); margin-bottom:20px;">Nothing due for review right now — come back tomorrow.</p>
        <a href="/" class="btn btn-primary btn-block">Back to home</a>
      </div>`;
    return;
  }
  renderItem();
}

function renderItem() {
  if (idx >= dueItems.length) return finalScreen();
  const item = dueItems[idx];
  const pct = Math.round((idx / dueItems.length) * 100);
  main.innerHTML = `
    <h1 style="font-size:20px; margin-bottom:4px;">🔄 Daily Review</h1>
    <p style="font-size:13px; color:var(--muted); margin-bottom:10px;">Item ${idx+1} of ${dueItems.length}</p>
    <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="cloze-sentence">${item.sentence}</div>
      <input type="text" class="write-input" id="review-input" placeholder="Type the missing word...">
      <div class="write-feedback" id="review-feedback"></div>
      <button class="btn btn-primary btn-block" id="review-check">Check</button>
    </div>
  `;
  const input = document.getElementById('review-input');
  const feedback = document.getElementById('review-feedback');
  const checkBtn = document.getElementById('review-check');
  input.focus();

  function check() {
    const val = normalizeAnswer(input.value);
    const accepted = item.accepted.map(normalizeAnswer);
    const correct = accepted.includes(val);
    input.disabled = true;
    input.classList.add(correct ? 'correct' : 'wrong');
    feedback.className = 'write-feedback ' + (correct ? 'ok' : 'no');
    feedback.textContent = correct ? '✅ Correct!' : `Correct answer: "${item.accepted[0]}"`;
    score.total++; if (correct) score.ok++;
    saveProgress(item.module_id, item.exercise_id, item.item_id, correct);
    checkBtn.textContent = 'Continue →';
    checkBtn.onclick = () => { idx++; renderItem(); };
  }
  checkBtn.onclick = check;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (!input.disabled) check(); } });
}

function finalScreen() {
  main.innerHTML = `
    <div class="card" style="text-align:center; padding:36px 20px;">
      <div style="font-size:46px; margin-bottom:8px;">🌠</div>
      <h2 style="margin-bottom:6px;">Review complete!</h2>
      <p style="color:var(--muted); margin-bottom:20px;">${score.ok} correct out of ${score.total}</p>
      <a href="/" class="btn btn-primary btn-block">Back to home</a>
    </div>`;
}

start();
checkUnreadChat();
</script>
</body>
</html>
