<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luna Italiano</title>
<link rel="stylesheet" href="/css/theme.css">
</head>
<body>

<div class="app-content">
  <div class="topbar">
    <div class="topbar-logo">
      <span class="moon-icon">🌙</span>
      <span class="logo-text">Luna<span>Italiano</span></span>
    </div>
    <div class="topbar-nav">
      <a href="/" class="active">Home</a>
      <a href="/moduli.html">Modules</a>
      <a href="/chat.html">Chat</a>
    </div>
  </div>

  <div class="main">
    <div class="hero">
      <div class="moon-stage">
        <div class="moon-system">
          <svg class="moon-main" viewBox="0 0 100 100" width="92" height="92">
            <defs>
              <radialGradient id="moonGrad" cx="35%" cy="32%" r="72%">
                <stop offset="0%" stop-color="#fffdf3"/>
                <stop offset="50%" stop-color="#efe6c8"/>
                <stop offset="100%" stop-color="#b8ac82"/>
              </radialGradient>
            </defs>
            <circle cx="50" cy="50" r="46" fill="url(#moonGrad)"/>
            <circle cx="34" cy="30" r="7" fill="#00000014"/>
            <circle cx="61" cy="40" r="10" fill="#00000012"/>
            <circle cx="46" cy="66" r="6" fill="#0000000f"/>
            <circle cx="67" cy="66" r="4" fill="#0000000f"/>
            <circle cx="27" cy="56" r="3.5" fill="#0000000f"/>
            <circle cx="55" cy="26" r="2.5" fill="#0000000d"/>
          </svg>
          <div class="moon-orbit"><div class="moon-satellite"></div></div>
        </div>
      </div>
      <h1>Hi Luna!</h1>
      <p>Every new word is a star you light up in your Italian sky.</p>
    </div>

    <div class="card" style="margin-bottom:16px; display:flex; align-items:center; gap:14px;">
      <div style="font-size:34px;">🪐</div>
      <div style="flex:1;">
        <h3 style="font-size:15px; margin-bottom:2px;">Your progress</h3>
        <p id="progress-text" style="font-size:13px; color:var(--muted);">Loading...</p>
      </div>
    </div>

    <h2 style="font-size:16px; margin-bottom:4px;">🌌 Your modules</h2>
    <div class="module-grid" id="module-grid"></div>

    <a href="/chat.html" class="btn btn-primary btn-block" style="margin-top:22px;">
      💬 Go to chat with Luna
    </a>
  </div>

  <div class="bottom-nav">
    <a href="/" class="active"><span class="bn-icon">🌙</span>Home</a>
    <a href="/moduli.html"><span class="bn-icon">⭐</span>Modules</a>
    <a href="/chat.html"><span class="bn-icon">💬</span>Chat</a>
  </div>
</div>

<script src="/js/starfield.js"></script>
<script>
async function loadHome() {
  const [modules, progress] = await Promise.all([
    fetch('/api/modules').then(r => r.json()),
    fetch('/api/progress/summary').then(r => r.json())
  ]);

  const progMap = {};
  progress.forEach(p => progMap[p.module_id] = p);
  const totalTent = progress.reduce((a,p) => a + p.tentativi, 0);
  const totalOk = progress.reduce((a,p) => a + p.corretti, 0);
  document.getElementById('progress-text').textContent =
    totalTent === 0 ? "You haven't started yet: pick your first module!" :
    `${totalOk} correct answers out of ${totalTent} exercises done`;

  const grid = document.getElementById('module-grid');
  grid.innerHTML = modules.map(m => {
    const p = progMap[m.id];
    const pill = p ? `${p.corretti}/${p.tentativi}` : 'Not started';
    return `
      <a class="module-card" href="/moduli.html?open=${m.id}">
        <div class="icon">${m.icon}</div>
        <div class="info">
          <h3>${m.title}</h3>
          <p>${m.subtitle}</p>
        </div>
        <div class="progress-pill">${pill}</div>
      </a>`;
  }).join('');
}
loadHome();
</script>
</body>
</html>
