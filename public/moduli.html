<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modules - Luna Italiano</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/theme.css">
<style>
  .reset-btn {
    background: none; border: 1px solid var(--card-border); color: var(--muted);
    font-family:'Quicksand',sans-serif; font-size: 11px; font-weight:700;
    padding: 5px 10px; border-radius: 16px; cursor:pointer; margin-left:auto;
  }
  .reset-btn:hover { border-color:#e65a5a; color:#e65a5a; }
  .module-head { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .ex-group-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px;
    color: var(--gold); margin: 14px 0 2px; padding-left: 2px;
  }
  .ex-group-label:first-child { margin-top: 0; }

  .ex-tile-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .ex-tile {
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    gap:7px; min-height: 108px; padding: 14px 8px;
    border-radius: var(--radius-sm);
    background: var(--card-bg); border:1px solid var(--card-border);
    text-decoration:none; color: var(--text); cursor:pointer;
    font-family:'Quicksand',sans-serif;
    transition: transform .15s, border-color .15s;
  }
  .ex-tile:hover { transform: translateY(-2px); border-color: var(--gold); }
  .ex-tile .et-icon {
    width:46px; height:46px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:22px;
    background: radial-gradient(circle, rgba(246,196,83,0.22), transparent 70%);
  }
  .ex-tile .et-title { font-size:12.5px; font-weight:700; line-height:1.25; }
  .ex-tile .et-sub { font-size:10px; color:var(--muted); }
  .ex-tile.group-tile { border-color: rgba(246,196,83,0.3); }
  .ex-tile.group-tile .et-icon { background: radial-gradient(circle, rgba(139,127,209,0.35), transparent 70%); }

  .back-link {
    display:inline-flex; align-items:center; gap:6px;
    font-size:13px; font-weight:700; color: var(--gold); text-decoration:none;
  }
</style>
</head>
<body>

<div class="app-content">
  <div class="topbar">
    <div class="topbar-logo">
      <span class="moon-icon">🌙</span>
      <span class="logo-text">Luna</span>
    </div>
    <div class="topbar-nav">
      <a href="/">Home</a>
      <a href="/moduli.html" id="nav-words">Words</a>
      <a href="/moduli.html?cat=grammar" id="nav-grammar">Grammar</a>
      <a href="/moduli.html?cat=verbs" id="nav-verbs">Verbs</a>
      <a href="/liste.html">Lists</a>
      <a href="/chat.html">Chat<span class="chat-badge"></span></a>
    </div>
  </div>

  <div class="main" id="main"></div>

  <div class="bottom-nav">
    <a href="/"><span class="bn-icon">🌙</span>Home</a>
    <a href="/moduli.html" id="bn-words"><span class="bn-icon">📚</span>Words</a>
    <a href="/moduli.html?cat=grammar" id="bn-grammar"><span class="bn-icon">✏️</span>Grammar</a>
    <a href="/moduli.html?cat=verbs" id="bn-verbs"><span class="bn-icon">📖</span>Verbs</a>
    <a href="/liste.html"><span class="bn-icon">🔊</span>Lists</a>
    <a href="/chat.html"><span class="bn-icon">💬<span class="chat-badge"></span></span>Chat</a>
  </div>
</div>

<script src="/js/starfield.js"></script>
<script src="/js/moon-emojis.js"></script>
<script src="/js/chat-shared.js"></script>
<script>
const params = new URLSearchParams(location.search);
const openId = params.get('open');
const cat = params.get('cat') || 'vocab';
const focusMod = params.get('mod');
const focusGroup = params.get('group');
let progressMap = {};

const navMap = { vocab: 'nav-words', grammar: 'nav-grammar', verbs: 'nav-verbs' };
if (navMap[cat]) document.getElementById(navMap[cat])?.classList.add('active');
const bnMap = { vocab: 'bn-words', grammar: 'bn-grammar', verbs: 'bn-verbs' };
if (bnMap[cat]) document.getElementById(bnMap[cat])?.classList.add('active');

const GROUP_ICONS = {
  '1. Essentials': '🌟',
  '2. Movement & Travel': '🚀',
  '3. Daily Routine & Senses': '☀️',
  '4. Communication & Thought': '💬',
  '5. Feelings & Relationships': '💛',
  '6. Work & Daily Tasks': '🛠️',
  '7. Life & Existence': '🌌',
  '8. Leisure & Play': '🎉',
  '1. Emotions & Feelings': '💛',
  '2. Technology & Media': '📱',
  '3. Nature & Animals': '🌿',
  '4. School & Learning': '🎓',
  '5. Money & Shopping': '💰',
  '6. Health & Body Care': '🩺',
  '7. Places in Town': '🏙️',
  '8. Society & Relationships': '👥',
  '9. Materials & Objects': '📦',
  '10. Time Expressions & Frequency': '⏳',
};

function exTile(modId, ex) {
  const iconMap = {
    scelta_multipla: '🌟', coniugazione: '✍️', abbinamento: '🌠',
    genere_dnd: '⚖️', costruttore: '🧩', cloze: '📝'
  };
  const icon = iconMap[ex.type] || '🌠';
  return `
    <a class="ex-tile" href="/esercizio.html?modulo=${modId}&esercizio=${ex.id}">
      <div class="et-icon">${icon}</div>
      <div class="et-title">${ex.title}</div>
    </a>
  `;
}

async function render() {
  if (focusMod && focusGroup !== null) return renderGroupFocus();

  const [allModules, progress] = await Promise.all([
    fetch('/api/modules').then(r => r.json()),
    fetch('/api/progress/summary').then(r => r.json())
  ]);
  const modules = allModules.filter(m => (m.category || 'vocab') === cat);
  progressMap = {};
  progress.forEach(p => progressMap[p.module_id] = p);

  const pageTitle = cat === 'grammar' ? '✏️ Grammar' : cat === 'verbs' ? '📖 Verb Practice' : cat === 'extra' ? '🎁 Extra Practice' : '📚 Learn new words';

  const main = document.getElementById('main');
  main.innerHTML = `<h1 style="font-size:20px; margin-bottom:14px;">${pageTitle}</h1>` +
    modules.map(m => {
      const p = progressMap[m.id];
      const pill = p ? `${p.corretti}/${p.tentativi} correct` : 'Not started';
      return `
      <div class="card" style="margin-bottom:14px;">
        <div class="module-head">
          <div style="font-size:32px;">${m.icon}</div>
          <div style="flex:1;">
            <h3 style="font-size:16px;">${m.title}</h3>
            <p style="font-size:13px; color:var(--muted);">${m.subtitle} · ${pill}</p>
          </div>
          <button class="reset-btn" data-module="${m.id}">↺ Reset</button>
        </div>
        <div id="ex-${m.id}" style="display:flex; flex-direction:column; gap:8px;"></div>
      </div>
    `;
    }).join('');

  for (const m of modules) {
    const full = await fetch('/api/modules/' + m.id).then(r => r.json());
    const box = document.getElementById('ex-' + m.id);

    const hasGroups = full.exercises.some(ex => ex.group);
    if (!hasGroups) {
      // Modulo semplice: mostra gli esercizi direttamente, 2 per riga
      box.innerHTML = `<div class="ex-tile-grid">${full.exercises.map(ex => exTile(m.id, ex)).join('')}</div>`;
    } else {
      // Modulo con categorie: mostra SOLO i tasti delle categorie, 2 per riga.
      // Cliccando su una categoria si apre una pagina dedicata (renderGroupFocus).
      const groups = [];
      full.exercises.forEach(ex => { if (!groups.includes(ex.group)) groups.push(ex.group); });

      box.innerHTML = `<div class="ex-tile-grid">` + groups.map((g, gi) => {
        const label = g.replace(/^\d+\.\s*/, '');
        const count = full.exercises.filter(e => e.group === g).length;
        const icon = GROUP_ICONS[g] || '🌙';
        return `
          <a class="ex-tile group-tile" href="/moduli.html?cat=${cat}&mod=${m.id}&group=${gi}">
            <div class="et-icon">${icon}</div>
            <div class="et-title">${label}</div>
            <div class="et-sub">${count} exercises</div>
          </a>`;
      }).join('') + `</div>`;
    }
  }

  document.querySelectorAll('.reset-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const modId = btn.dataset.module;
      if (!confirm('Reset all progress for this module? This cannot be undone.')) return;
      await fetch('/api/progress/' + modId, { method: 'DELETE' });
      render();
    });
  });

  if (openId) {
    document.getElementById('ex-' + openId)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// Pagina dedicata a UNA SOLA categoria (es. solo i verbi di "Essentials")
async function renderGroupFocus() {
  const full = await fetch('/api/modules/' + focusMod).then(r => r.json());
  const groups = [];
  full.exercises.forEach(ex => { if (ex.group && !groups.includes(ex.group)) groups.push(ex.group); });
  const groupName = groups[parseInt(focusGroup, 10)];
  const label = groupName ? groupName.replace(/^\d+\.\s*/, '') : 'Exercises';
  const icon = GROUP_ICONS[groupName] || '🌙';
  const exs = groupName ? full.exercises.filter(e => e.group === groupName) : [];

  const main = document.getElementById('main');
  main.innerHTML = `
    <a class="back-link" href="/moduli.html?cat=${cat}">← Back to ${full.title}</a>
    <div class="card" style="margin-top:12px;">
      <div class="module-head">
        <div style="font-size:32px;">${icon}</div>
        <div style="flex:1;">
          <h3 style="font-size:16px;">${label}</h3>
          <p style="font-size:13px; color:var(--muted);">${exs.length} exercises</p>
        </div>
      </div>
      <div class="ex-tile-grid">${exs.map(ex => exTile(focusMod, ex)).join('')}</div>
    </div>
  `;
}

render();
checkUnreadChat();
</script>
</body>
</html>
